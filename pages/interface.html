<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
         body {
            background-color: rgb(246, 250, 255);
            color: rgb(51, 51, 50);
            letter-spacing: 0.9px;
            word-spacing: 0.9px;
            line-height: 24px;
            font-size: 18px;
         }

         header {
            margin-bottom: 40px;
         }

         main {
            margin-bottom: 200px;
            padding: 0 50px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
         }

        .head-cont {
            height: 130px;
            width: 70%;
            background: url("/asset/pinger.webp") no-repeat center;
            background-size: cover;
            border-radius: 10px;
            margin: auto;
            color: rgb(238, 237, 237);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .head-cont > b {
            font-size: 25px;
            text-shadow: -2px -2px 0 rgb(122, 1, 1), 2px -2px 0 rgb(122, 1, 1), 
            -2px 2px 0 rgb(122, 1, 1), 2px 2px 0 rgb(122, 1, 1);
        }

        .head-cont > b.single {
            font-size: 50px
        }

        header > ul {
            list-style: none;
            padding-left: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        header > ul li {
            display: inline-block;
            padding: 0 30px;
            margin-top: 10px;
        }

        .active-link {
            padding: 5px 20px;
            border-radius: 6px;
            color: white;
            background-color: rgb(194, 167, 16);
        }

        .column {
            flex: 25%;
            max-width: 25%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .column img {
            margin-top: 20px;
            vertical-align: middle;
            border-radius: 20px;
            border: 1px solid rgb(222, 229, 235);
        }

        .column img:hover{
            transform: scale(105%);
            border: 2px solid rgb(218, 189, 28);
        }


        @media screen and (max-width: 992px) {
            .column {
                flex: 50%;
                max-width: 50%;
            }
        }


        @media screen and (max-width: 768px) {
            .head-cont {
                width: 100%;
            }

            main {
                padding: 0 25px;
            }

            header > ul > li {
                padding: 0 15px;
            }
        }


        @media screen and (max-width: 576px) {
            .column {
                flex: 100%;
                max-width: 100%;
            }
        }




        </style>

        <link rel="icon" type="image/png" href="/asset/favicon.webp">
        <title>The Pinger Project</title>

    </head>

    <body>

        <header>
            <div class="head-cont">
                <b>PING</b>
                <b class="single">A</b>
                <b>CRISIS</b>
            </div>
            <ul>
                <li><a class="active-link" href="/pages/interface.html" title="See user flow, UX flow. UI design and more">UI/UX</a></li>
                <li><a href="/index.html" title="Go to home page">Home</a></li>
                <li><a href="/pages/details.html" title="See requirements, user personas, data model and more">Details</a></li>
                <li><a href="/pages/video.html" title="See the application in action">Video</a></li>
                <li><a href="/pages/demo.html" title="comming soon">Try it</a></li>
            </ul>
            <hr>
        </header>

        <main>

            <div class="column">
                <a href="/asset/audit.png"><img src="/asset/audit.png" style="width:100%"></a>
                <a href="/asset/escalate.png"><img src="/asset/escalate.png" style="width:100%"></a>
            </div>
            <div class="column">
                <a href="/asset/respond.png"><img src="/asset/respond.png" style="width:100%"></a>
                <a href="/asset/send.png"><img src="/asset/send.png" style="width:100%"></a>
            </div>
            <div class="column">
                <a href="/asset/audit.png"><img src="/asset/audit.png" style="width:100%"></a>
                <a href="/asset/escalate.png"><img src="/asset/escalate.png" style="width:100%"></a>
            </div>
            <div class="column">
                <a href="/asset/manage.png"><img src="/asset/manage.png" style="width:100%"></a>
                <a href="/asset/respond.png"><img src="/asset/respond.png" style="width:100%"></a>
            </div>
            
        </main>




    </body>
</html>
