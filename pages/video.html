<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
         body {
            background-color: rgb(246, 250, 255);
            color: rgb(51, 51, 50);
            letter-spacing: 0.9px;
            word-spacing: 0.9px;
            line-height: 24px;
            font-size: 18px;
         }

         header {
            margin-bottom: 40px;
         }

         main {
            margin-bottom: 200px;
            text-align: center;
         }

        .head-cont {
            height: 130px;
            width: 70%;
            background: url("/asset/pinger.webp") no-repeat center;
            background-size: cover;
            border-radius: 10px;
            margin: auto;
            color: rgb(238, 237, 237);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .head-cont > b {
            font-size: 25px;
            text-shadow: -2px -2px 0 rgb(122, 1, 1), 2px -2px 0 rgb(122, 1, 1), 
            -2px 2px 0 rgb(122, 1, 1), 2px 2px 0 rgb(122, 1, 1);
        }

        .head-cont > b.single {
            font-size: 50px
        }

        header > ul {
            list-style: none;
            padding-left: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        header > ul li {
            display: inline-block;
            padding: 0 30px;
            margin-top: 10px;
        }

        .active-link {
            padding: 5px 20px;
            border-radius: 6px;
            color: white;
            background-color: rgb(194, 167, 16);
        }

        #loader {
            width: 100px;
            margin-top: 80px;
        }

        #videoBox {
            display: none;
        }




        @media screen and (max-width: 768px) {
            .head-cont {
                width: 100%;
            }

            .head-cont > b {
                font-size: 20px;
            }

            .head-cont > b.single {
                font-size: 40px;
            }

            header > ul > li {
                padding: 0 15px;
            }
        }
        

        </style>

        <link rel="icon" type="image/png" href="/asset/favicon.webp">
        <title>The Pinger Project</title>

        <script>
            window.addEventListener("DOMContentLoaded", function () {
                const videoBox = document.getElementById("videoBox");
                const videoFrame = document.querySelector("#videoBox > iframe");
                const loader = document.getElementById("loader");
                //console.log("I summoned another event");
        
                videoFrame.addEventListener("load", function () {
                    loader.style.display = "none";
                    videoBox.style.display = "block";
                    //console.log("I was summoned");
                });
            });
        </script>

    </head>

    <body>

        <header>
            <div class="head-cont">
                <b>PING</b>
                <b class="single">A</b>
                <b>CRISIS</b>
            </div>
            <ul>
                <li><a class="active-link" href="/pages/video.html" title="See the application in action">Video</a></li>
                <li><a href="/index.html" title="Go to home page">Home</a></li>
                <li><a href="/pages/details.html" title="See requirements, user personas, data model and more">Details</a></li>
                <li><a href="/pages/interface.html" title="See user flow, UX flow. UI design and more">UI/UX</a></li>
                <li><a href="/pages/demo.html" title="comming soon">Try it</a></li>
            </ul>
            <hr>
        </header>

        <main>
            <div id="videoBox" style="position: relative; padding-bottom: 56.25%; height: 0;">
                <iframe src="https://www.loom.com/embed/ebec0ac2151742ff917f333485190398?sid=3e240e9e-7634-4501-9a04-7b16799c0570" 
                frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen 
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
                </iframe>
            </div>
            <img id="loader" src="/asset/radiation-anime.webp"/>
        </main>
    </body>
</html>
