<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
         body {
            background-color: rgb(246, 250, 255);
            color: rgb(51, 51, 50);
            letter-spacing: 0.9px;
            word-spacing: 0.9px;
            line-height: 24px;
            font-size: 18px;
         }

         header {
            margin-bottom: 50px;
         }

         main {
            margin-bottom: 200px;
            text-align: center;
         }

        .head-cont {
            height: 130px;
            width: 70%;
            background: url("/asset/pinger.webp") no-repeat center;
            background-size: cover;
            border-radius: 10px;
            margin: auto;
            color: rgb(238, 237, 237);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .head-cont > b {
            font-size: 25px;
            text-shadow: -2px -2px 0 rgb(122, 1, 1), 2px -2px 0 rgb(122, 1, 1), 
            -2px 2px 0 rgb(122, 1, 1), 2px 2px 0 rgb(122, 1, 1);
        }

        .head-cont > b.single {
            font-size: 50px
        }

        header > ul {
            list-style: none;
            padding-left: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        header > ul li {
            display: inline-block;
            padding: 0 30px;
            margin-top: 10px;
        }

        main > hr {
            margin: 30px 0 30px 0;
        }

        main > h3 {
            color: rgb(206, 135, 2);
        }

        main > img {
            width: 80px;
        }

        .active-link {
            padding: 5px 20px;
            border-radius: 6px;
            color: white;
            background-color: rgb(194, 167, 16);
        }



        @media screen and (max-width: 768px) {
            body {
                font-size: 16px;
            }

            .head-cont {
                width: 100%;
            }

            .head-cont > b {
                font-size: 20px;
            }

            .head-cont > b.single {
                font-size: 40px;
            }

            .project {
                padding: 0 20px;
            }

            header > ul > li {
                padding: 0 15px;
            }
        }
        

        </style>

        <link rel="icon" type="image/png" href="/asset/favicon.webp">
        <title>The Pinger Project</title>

    </head>

    <body>

        <header>
            <div class="head-cont">
                <b>PING</b>
                <b class="single">A</b>
                <b>CRISIS</b>
            </div>
            <ul>
                <li><a class="active-link" href="/pages/demo.html" title="See source code">Code</a></li>
                <li><a href="/index.html" title="Go to home page">Home</a></li>
                <li><a href="/pages/details.html" title="See requirements, user personas, data model and more">Details</a></li>
                <li><a href="/pages/interface.html" title="See user flow, UX flow. UI design and more">UI/UX</a></li>
                <li><a href="/pages/video.html" title="See the application in action">Video</a></li>
            </ul>
        </header>

        <main>
            <hr> <br> <br>
            <h3>Follow the link below for the source code</h3>
            <img src="/asset/radiation.webp"/>
            <br><br>
            <a href="https://github.com/SneezyG/Guardians">guardians github repo</a>
        </main>




    </body>
</html>
