        .head-cont {

        }

            list-style: none;
            padding-left: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        header > ul li {
            display: inline-block;
            padding: 0 30px;
            margin-top: 10px;
        }

        .project {
            padding: 0 50px;
        }

        .project > p {
            padding: 0 20px;
        }

        main > hr {
            margin: 30px 0 30px 0;
        }

        .active-link {
            padding: 5px 20px;
            border-radius: 6px;
            color: white;
            background-color: rgb(165, 141, 3);
        }



        @media screen and (max-width: 768px) {
            .head-cont {
                width: 100%;
            }

            .project {
                padding: 0 20px;
            }

            header > ul > li {
                padding: 0 15px;
